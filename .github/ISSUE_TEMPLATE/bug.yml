name: Reproducible bug / 可复现问题
description: Report an installation, accounting, API, or Dashboard defect with sanitized evidence.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issues are for reproducible defects. Use Discussions for questions and feature ideas.
        Do not include `auth.json`, hostnames, machine IDs, local paths, Thread titles, Session IDs, exact timestamps, prompts, replies, reasoning, or tool output.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `codex-usage version`.
      placeholder: codex-usage 2.3.2 (...)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows amd64
        - Windows arm64
        - Linux amd64
        - Linux arm64
        - WSL amd64
        - WSL arm64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Minimal commands and actions that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized diagnostics
      description: Include sanitized `codex-usage doctor` output when useful.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, hostnames, IDs, paths, Thread/Session data, exact timestamps, and conversation content.
          required: true
