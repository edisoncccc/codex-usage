name: source-only release guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Verify source-only policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./internal/installpolicy -count=1
