name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: go test ./...
      - run: go vet ./...
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: go build -trimpath -o codex-usage ./cmd/codex-usage
      - run: npm test
        env:
          CODEX_USAGE_BIN: ./codex-usage
      - name: Build release binaries
        run: VERSION="${GITHUB_REF_NAME#v}" bash ./scripts/build.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE="docs/releases/${GITHUB_REF_NAME}.md"
          ASSETS=(
            dist/codex-usage-linux-amd64
            dist/codex-usage-linux-arm64
            dist/codex-usage-windows-amd64.exe
            dist/codex-usage-windows-arm64.exe
            dist/SHA256SUMS
          )
          if [[ -f "$NOTES_FILE" ]]; then
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
              --title "codex-usage ${GITHUB_REF_NAME}" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
              --title "codex-usage ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
