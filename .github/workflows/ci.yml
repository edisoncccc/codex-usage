name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - run: go test ./...
      - run: go vet ./...

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - run: ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: codex-meter-binaries
          path: dist/

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: go build -trimpath -o codex-meter ./cmd/codex-meter
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CODEX_METER_BIN: ./codex-meter
