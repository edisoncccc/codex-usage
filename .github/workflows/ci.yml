name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - run: go test ./...
      - run: go vet ./...

  cross-build:
    name: cross-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - run: bash ./scripts/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: codex-usage-binaries
          path: dist/
          if-no-files-found: error

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: go build -trimpath -o codex-usage ./cmd/codex-usage
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CODEX_USAGE_BIN: ./codex-usage
